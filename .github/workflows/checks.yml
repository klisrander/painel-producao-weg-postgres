name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: synthetic_ci
          POSTGRES_PASSWORD: synthetic_ci_password
          POSTGRES_DB: synthetic_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic_ci -d synthetic_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://synthetic_ci:synthetic_ci_password@127.0.0.1:5432/synthetic_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
