# Generic starting point. WEG must replace/approve runner tags and corporate templates.
stages: [verify, package, deploy]
variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
verify:
  image: node:22-bookworm
  stage: verify
  services:
    - name: postgres:17-alpine
      alias: postgres
    - name: redis:8-alpine
      alias: redis
  variables:
    POSTGRES_DB: panel_test
    POSTGRES_USER: panel
    POSTGRES_PASSWORD: synthetic-ci-only
    DATABASE_URL: postgresql://panel:synthetic-ci-only@postgres:5432/panel_test
    TEST_DATABASE_URL: postgresql://panel:synthetic-ci-only@postgres:5432/panel_test
    TEST_REDIS_URL: redis://redis:6379
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --ignore-scripts
    - npm run generate
    - npm run db:validate
    - npm run build
    - npm run typecheck:tools
    - npm test
    - npm run test:integration
    - npm run test:auth
    - npx playwright install --with-deps chromium
    - npm run test:ui
    - npm audit --omit=dev --audit-level=high
package:
  stage: package
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p ~/.docker
    - REGISTRY_AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$REGISTRY_AUTH" > ~/.docker/config.json
  script:
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=deploy --opt filename=Dockerfile.api --opt target=runtime --output type=image,name=$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA,push=true
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=deploy --opt filename=Dockerfile.api --opt target=migrations --output type=image,name=$CI_REGISTRY_IMAGE/migrations:$CI_COMMIT_SHA,push=true
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=deploy --opt filename=Dockerfile.web --output type=image,name=$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA,push=true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
.deploy:
  stage: deploy
  image:
    name: alpine/k8s:1.34.13
    entrypoint: [""]
  resource_group: "$CI_ENVIRONMENT_NAME"
  script:
    - test -n "$KUBE_CONTEXT" && test -n "$KUBE_NAMESPACE"
    - kubectl config use-context "$KUBE_CONTEXT"
    - cd deploy/k8s/overlays/$DEPLOY_OVERLAY
    - kustomize edit set namespace "$KUBE_NAMESPACE"
    - kustomize edit set image PANEL_API=$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA PANEL_WEB=$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA PANEL_MIGRATIONS=$CI_REGISTRY_IMAGE/migrations:$CI_COMMIT_SHA
    - kustomize build . > /tmp/release.yaml
    - kubectl apply -f /tmp/release.yaml -l panel.component=config
    - kubectl delete job panel-migrate -n "$KUBE_NAMESPACE" --ignore-not-found
    - kubectl apply -f /tmp/release.yaml -l panel.component=migration
    - kubectl wait -n "$KUBE_NAMESPACE" --for=condition=complete job/panel-migrate --timeout=180s
    - kubectl apply -f /tmp/release.yaml
    - kubectl rollout status -n "$KUBE_NAMESPACE" deployment/panel-api --timeout=180s
    - kubectl rollout status -n "$KUBE_NAMESPACE" deployment/panel-web --timeout=180s
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
homologation:
  extends: .deploy
  variables:
    DEPLOY_OVERLAY: homologation
  environment:
    name: homologation
production:
  extends: .deploy
  needs: [package, homologation]
  variables:
    DEPLOY_OVERLAY: production
  environment:
    name: production
