# The API has no public Ingress and accepts application traffic from Web pods only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: panel-api-ingress
spec:
  podSelector:
    matchLabels: { app: panel-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: panel-web } }
      ports: [{ port: 4000, protocol: TCP }]
# WEG must add its ingress-controller selectors and approved egress rules.
# External database, Keycloak, Redis and SMTP addresses are intentionally not guessed.
