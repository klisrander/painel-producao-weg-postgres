apiVersion: batch/v1
kind: Job
metadata:
  name: panel-migrate
  labels: { panel.component: migration }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        { app: panel-migration, app.kubernetes.io/part-of: panel-production }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {
          runAsNonRoot: true,
          runAsUser: 1000,
          runAsGroup: 1000,
          fsGroup: 1000,
          seccompProfile: { type: RuntimeDefault },
        }
      containers:
        - name: migrate
          image: PANEL_MIGRATIONS
          command: ["npm", "run", "db:deploy"]
          envFrom:
            - secretRef: { name: panel-migration-secrets }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          env: [{ name: npm_config_cache, value: /tmp/npm }]
          volumeMounts: [{ name: temporary, mountPath: /tmp }]
      volumes: [{ name: temporary, emptyDir: { sizeLimit: 64Mi } }]
