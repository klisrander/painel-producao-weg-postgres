apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: panel-api }
  template:
    metadata:
      labels: { app: panel-api, app.kubernetes.io/part-of: panel-production }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {
          runAsNonRoot: true,
          runAsUser: 1000,
          runAsGroup: 1000,
          fsGroup: 1000,
          seccompProfile: { type: RuntimeDefault },
        }
      containers:
        - name: api
          image: PANEL_API
          ports: [{ containerPort: 4000 }]
          envFrom:
            - configMapRef: { name: panel-runtime }
            - secretRef: { name: panel-api-secrets }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 768Mi }
          startupProbe:
            httpGet: { path: /health/live, port: 4000 }
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/live, port: 4000 }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health/ready, port: 4000 }
            periodSeconds: 10
          volumeMounts:
            - { name: temporary, mountPath: /tmp }
            - { name: access, mountPath: /etc/panel, readOnly: true }
      volumes:
        - { name: temporary, emptyDir: { sizeLimit: 64Mi } }
        - name: access
          configMap: { name: panel-access }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel-web
spec:
  replicas: 2
  selector:
    matchLabels: { app: panel-web }
  template:
    metadata:
      labels: { app: panel-web, app.kubernetes.io/part-of: panel-production }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {
          runAsNonRoot: true,
          runAsUser: 1000,
          runAsGroup: 1000,
          fsGroup: 1000,
          seccompProfile: { type: RuntimeDefault },
        }
      containers:
        - name: web
          image: PANEL_WEB
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: panel-runtime }
            - secretRef: { name: panel-web-secrets }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 768Mi }
          startupProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /api/health/ready, port: 3000 }
            periodSeconds: 10
          volumeMounts:
            - { name: temporary, mountPath: /tmp }
      volumes:
        - { name: temporary, emptyDir: { sizeLimit: 64Mi } }
