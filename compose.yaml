# Local infrastructure only; no connection to production is configured here.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: panel
      POSTGRES_USER: panel
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?Set a local database password}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["panel-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel -d panel"]
      interval: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
volumes:
  panel-db:
